<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F350 Diesel Dashboard — Live</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0c0e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg-0:#0a0c0e;
    --bg-1:#14171a;
    --bg-2:#1c2024;
    --line:#2a2f34;
    --text-0:#f2f0ec;
    --text-1:#9aa0a6;
    --accent:#39ff8a;
    --accent-2:#8effc0;
    --good:#3ecf7e;
    --warn:#c9f24a;
    --bad:#ff5f5f;
    --steel:#4a5560;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:radial-gradient(1200px 700px at 50% -10%, #1a1e22 0%, var(--bg-0) 60%);
    font-family:'Segoe UI', Arial, sans-serif;
    color:var(--text-0);
    overflow:hidden;
  }
  .dash{
    width:100vw;height:100vh;
    display:grid;
    grid-template-rows:auto 1fr auto;
    padding:14px 20px 10px;
    background-image:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 6px);
  }
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    padding-bottom:8px;border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .badge{
    width:34px;height:34px;border-radius:6px;
    background:linear-gradient(160deg,#5dffa0,#0e5f36);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px;letter-spacing:0.5px;
    box-shadow:0 0 14px rgba(57,255,138,0.45);
  }
  .brand .title{font-size:15px;font-weight:700;letter-spacing:2px;color:var(--text-0);}
  .brand .subtitle{font-size:10px;letter-spacing:2px;color:var(--text-1);margin-top:1px;}
  .status{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--text-1);letter-spacing:1px;}
  .status .dot{
    width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;
    background:var(--bad);box-shadow:0 0 6px var(--bad);
  }
  .status.live .dot{background:var(--good);box-shadow:0 0 6px var(--good);}
  #connectBtn{
    background:linear-gradient(160deg,#3ecf7e,#0e5f36);
    color:#04150c;border:none;border-radius:8px;padding:8px 16px;
    font-weight:700;font-size:12px;letter-spacing:1px;cursor:pointer;
  }
  #connectBtn:disabled{opacity:0.6;}
  .status .clock{color:var(--text-0);font-weight:600;font-size:13px;letter-spacing:1px;}

  .main{display:grid;grid-template-columns: 1.1fr 1.5fr 1.1fr;gap:14px;padding:14px 0;align-items:center;}
  .col{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;height:100%;}
  .col.triple .gauge{width:126px;height:126px;}
  .col.triple .gauge svg{width:126px;height:126px;}
  .col.triple .gauge-center .val{font-size:21px;}

  .center-cluster{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
  .speed-value{
    font-size:96px;font-weight:800;line-height:1;color:var(--text-0);
    text-shadow:0 0 24px rgba(57,255,138,0.3);font-variant-numeric:tabular-nums;
  }
  .speed-unit{font-size:14px;letter-spacing:3px;color:var(--text-1);margin-top:-6px;}
  .rpm-wrap{width:100%;max-width:520px;margin-top:10px;}
  .rpm-label{display:flex;justify-content:space-between;font-size:10px;color:var(--text-1);letter-spacing:2px;margin-bottom:4px;}
  .rpm-bar-bg{width:100%;height:16px;border-radius:8px;background:var(--bg-2);border:1px solid var(--line);overflow:hidden;position:relative;}
  .rpm-bar-fill{
    height:100%;border-radius:8px;
    background:linear-gradient(90deg, #0e5f36 0%, #3ecf7e 45%, #8effc0 80%, #c9f24a 100%);
    width:0%;transition:width 0.4s ease;box-shadow:0 0 10px rgba(57,255,138,0.4);
  }
  .rpm-ticks{display:flex;justify-content:space-between;font-size:9px;color:var(--steel);margin-top:3px;}

  .sub-strip{display:flex;gap:24px;margin-top:14px;}
  .sub-item{text-align:center;}
  .sub-item .val{font-size:22px;font-weight:700;color:var(--text-0);}
  .sub-item .lbl{font-size:9px;letter-spacing:2px;color:var(--text-1);margin-top:2px;}

  .gauge{position:relative;width:158px;height:158px;}
  .gauge svg{transform:rotate(-90deg);}
  .gauge-track{fill:none;stroke:var(--bg-2);stroke-width:10;}
  .gauge-fill{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 0.5s ease;stroke-dasharray:314;stroke-dashoffset:314;}
  .gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .gauge-center .val{font-size:26px;font-weight:800;color:var(--text-0);font-variant-numeric:tabular-nums;}
  .gauge-center .unit{font-size:9px;color:var(--text-1);letter-spacing:1px;margin-top:1px;}
  .gauge-center .lbl{position:absolute;bottom:8px;font-size:9px;letter-spacing:2px;color:var(--text-1);text-transform:uppercase;}

  .gauge.g-mint .gauge-fill{stroke:url(#gradMint);filter:drop-shadow(0 0 6px rgba(94,255,169,0.55));}
  .gauge.g-emerald .gauge-fill{stroke:url(#gradEmerald);filter:drop-shadow(0 0 6px rgba(62,207,126,0.55));}
  .gauge.g-lime .gauge-fill{stroke:url(#gradLime);filter:drop-shadow(0 0 6px rgba(201,242,74,0.55));}
  .gauge.g-forest .gauge-fill{stroke:url(#gradForest);filter:drop-shadow(0 0 6px rgba(20,130,80,0.55));}
  .gauge.g-sage .gauge-fill{stroke:url(#gradSage);filter:drop-shadow(0 0 6px rgba(140,200,150,0.5));}
  .gauge.bad .gauge-fill{stroke:var(--bad);filter:drop-shadow(0 0 5px rgba(255,95,95,0.6));}

  .bottombar{display:grid;grid-template-columns: 1fr 1fr 1fr 1fr;gap:14px;padding-top:10px;border-top:1px solid var(--line);}
  .fuel-card{background:var(--bg-1);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;}
  .fuel-card .top-row{display:flex;justify-content:space-between;align-items:baseline;}
  .fuel-card .name{font-size:10px;letter-spacing:2px;color:var(--text-1);}
  .fuel-card .num{font-size:24px;font-weight:800;color:var(--text-0);}
  .fuel-bar-bg{width:100%;height:10px;border-radius:5px;background:var(--bg-2);overflow:hidden;}
  .fuel-bar-fill{height:100%;border-radius:5px;width:0%;transition:width 0.4s ease;}
  .fuel .fuel-bar-fill{background:linear-gradient(90deg,#0e5f36,#3ecf7e,#a8ffce);box-shadow:0 0 8px rgba(62,207,126,0.5);}
  .def .fuel-bar-fill{background:linear-gradient(90deg,#06301c,#12a55a,#5dffa0);box-shadow:0 0 8px rgba(93,255,160,0.5);}
  .fuel, .def{border-color:#33393f;}
  .econ .num{color:var(--accent-2);}
  .odo .num{font-size:18px;letter-spacing:1px;}

  .debug{
    position:absolute;left:20px;bottom:6px;max-width:44%;max-height:70px;overflow:auto;
    font-size:8px;color:var(--steel);white-space:pre-wrap;font-family:monospace;opacity:0.7;
  }
  .footer-note{position:absolute;bottom:6px;right:20px;font-size:9px;color:var(--steel);letter-spacing:1px;}
</style>
</head>
<body>
<div class="dash">

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="gradMint" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0e5f36"/><stop offset="50%" stop-color="#3ecf7e"/><stop offset="100%" stop-color="#a8ffce"/>
      </linearGradient>
      <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#093b23"/><stop offset="50%" stop-color="#12a55a"/><stop offset="100%" stop-color="#5dffa0"/>
      </linearGradient>
      <linearGradient id="gradLime" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2c5f0e"/><stop offset="50%" stop-color="#8ecf3e"/><stop offset="100%" stop-color="#e4ffa8"/>
      </linearGradient>
      <linearGradient id="gradForest" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06301c"/><stop offset="50%" stop-color="#1b7a49"/><stop offset="100%" stop-color="#66d99a"/>
      </linearGradient>
      <linearGradient id="gradSage" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2f4a3a"/><stop offset="50%" stop-color="#7fb894"/><stop offset="100%" stop-color="#c7f0d6"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="topbar">
    <div class="brand">
      <div class="badge">F350</div>
      <div>
        <div class="title">POWER STROKE DIESEL</div>
        <div class="subtitle">6.7L &middot; 2021 &middot; Live OBD2</div>
      </div>
    </div>
    <div class="status" id="connStatus">
      <span><span class="dot"></span><span id="statusText">Not connected</span></span>
      <button id="connectBtn">CONNECT OBD</button>
      <span class="clock" id="clock">--:--</span>
    </div>
  </div>

  <div class="main">

    <div class="col triple">
      <div class="gauge g-lime" id="g-egt">
        <svg viewBox="0 0 120 120" width="158" height="158">
          <circle class="gauge-track" cx="60" cy="60" r="50"/>
          <circle class="gauge-fill" cx="60" cy="60" r="50"/>
        </svg>
        <div class="gauge-center"><div class="val">--</div><div class="unit">°F</div><div class="lbl">EGT</div></div>
      </div>
      <div class="gauge g-mint" id="g-boost">
        <svg viewBox="0 0 120 120" width="158" height="158">
          <circle class="gauge-track" cx="60" cy="60" r="50"/>
          <circle class="gauge-fill" cx="60" cy="60" r="50"/>
        </svg>
        <div class="gauge-center"><div class="val">--</div><div class="unit">PSI</div><div class="lbl">Boost</div></div>
      </div>
      <div class="gauge g-forest" id="g-soot">
        <svg viewBox="0 0 120 120" width="158" height="158">
          <circle class="gauge-track" cx="60" cy="60" r="50"/>
          <circle class="gauge-fill" cx="60" cy="60" r="50"/>
        </svg>
        <div class="gauge-center"><div class="val">--</div><div class="unit">% LOAD</div><div class="lbl">Soot</div></div>
      </div>
    </div>

    <div class="center-cluster">
      <div class="speed-value" id="speedVal">0</div>
      <div class="speed-unit">MPH</div>
      <div class="rpm-wrap">
        <div class="rpm-label"><span>RPM</span><span id="rpmVal">0</span></div>
        <div class="rpm-bar-bg"><div class="rpm-bar-fill" id="rpmBar"></div></div>
        <div class="rpm-ticks"><span>0</span><span>1k</span><span>2k</span><span>3k</span><span>4k</span><span>5k</span></div>
      </div>
      <div class="sub-strip">
        <div class="sub-item"><div class="val" id="gearVal">--</div><div class="lbl">GEAR</div></div>
      </div>
    </div>

    <div class="col">
      <div class="gauge g-emerald" id="g-coolant">
        <svg viewBox="0 0 120 120" width="158" height="158">
          <circle class="gauge-track" cx="60" cy="60" r="50"/>
          <circle class="gauge-fill" cx="60" cy="60" r="50"/>
        </svg>
        <div class="gauge-center"><div class="val">--</div><div class="unit">°F</div><div class="lbl">Coolant</div></div>
      </div>
      <div class="gauge g-sage" id="g-trans">
        <svg viewBox="0 0 120 120" width="158" height="158">
          <circle class="gauge-track" cx="60" cy="60" r="50"/>
          <circle class="gauge-fill" cx="60" cy="60" r="50"/>
        </svg>
        <div class="gauge-center"><div class="val">--</div><div class="unit">°F</div><div class="lbl">Trans</div></div>
      </div>
    </div>

  </div>

  <div class="bottombar">
    <div class="fuel-card fuel" id="fuelPct">
      <div class="top-row"><span class="name">FUEL</span><span class="num">--%</span></div>
      <div class="fuel-bar-bg"><div class="fuel-bar-fill"></div></div>
    </div>
    <div class="fuel-card def" id="defPct">
      <div class="top-row"><span class="name">DEF</span><span class="num">--%</span></div>
      <div class="fuel-bar-bg"><div class="fuel-bar-fill"></div></div>
    </div>
    <div class="fuel-card econ">
      <div class="top-row"><span class="name">FUEL ECON</span><span class="num">-- MPG</span></div>
      <div class="fuel-bar-bg"><div class="fuel-bar-fill" style="background:linear-gradient(90deg,#2c5f0e,#8ecf3e,#e4ffa8);width:0%;"></div></div>
    </div>
    <div class="fuel-card odo">
      <div class="top-row"><span class="name">TRIP / ODO</span><span class="num">-- mi</span></div>
      <div class="fuel-bar-bg"><div class="fuel-bar-fill" style="background:linear-gradient(90deg,#2f4a3a,#7fb894,#c7f0d6);width:0%;"></div></div>
    </div>
  </div>

  <div class="debug" id="debugLog"></div>
  <div class="footer-note">2021 F350 6.7L &middot; Veepeak OBDCheck BLE</div>
</div>

<script>
  function updateClock(){
    const d = new Date();
    document.getElementById('clock').textContent = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }
  updateClock();
  setInterval(updateClock, 1000 * 15);
</script>
<script src="app.js"></script>
</body>
</html>
